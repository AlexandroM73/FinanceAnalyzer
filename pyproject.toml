[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[project]
name = "finance-analysis"
version = "0.1.0"
description = "Приложение для анализа финансовых транзакций"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "pandas>=1.3.0",
    "openpyxl>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "black>=22.0",
    "isort>=5.0.0",
    "mypy>=0.900",
    "pytest>=7.0.0",
]

[tool.black]
line-length = 119
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 119
multi_line_output = 3  # Vertical hanging indent
known_first_party = ["src"]
sections = "FUTURE,STDLIB,THIRDPARTY,FIRSTPARTY,LOCALFOLDER"

[tool.mypy]
python_version = "3.8"
disallow_untyped_defs = true
warn_return_any = true
ignore_missing_imports = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
check_untyped_defs = true

exclude = [
    "venv",
    ".venv",
    "__pycache__",
    ".git",
    "build",
    "dist"
]

[tool.flake8]
max-line-length = 119
extend-ignore = ["E203", "W503", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test"]
python_functions = ["test"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src", "main.py"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*__init__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 2

[tool.coverage.paths]
source = ["."]
